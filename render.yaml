# Render Blueprint — everything this repository deploys, in one apply.
#
#   Render dashboard -> New -> Blueprint -> pick this repository
#
# Before it will work, Render's GitHub App needs access to this repository:
# Render -> Settings -> GitHub -> Configure -> add `barangay` to the selected
# repositories. Without that, Render reports the repo as "invalid or
# unfetchable" even though it exists and you can push to it.
#
# ---------------------------------------------------------------------------
# What is here, and what moved out
#
# **One service: the barangay demo.** This repository is the barangay product
# (see SPLIT.md), and the three things that used to sit beside it in the eLGU
# blueprint stayed there rather than being copied:
#
#   - the **municipal demo** (`elgu-demo`), which is the other product
#   - the **owner portal** (`elgu-owner`) and its database, which is the
#     reseller registry for *both* products and holds real state. Two
#     blueprints deploying it would mean two registries disagreeing about the
#     same customers, and Render allows one free Postgres per workspace — so
#     it is deployed from the eLGU repository only. `owner/` is still present
#     in this tree so a merge back is a merge; it is simply not applied here.
#
# A **production barangay instance is not in this file** either, and that is
# the free tier's doing rather than an oversight: a real barangay needs its own
# Postgres, and a barangay's records should not sit on a tier that expires
# after thirty days. See "Standing up a barangay" in DEPLOY.md.
#
# ---------------------------------------------------------------------------
# Why the demo is static
#
# The demo build answers every API call in the browser, so it needs no server
# and no database at all. That makes it a CDN upload: it opens instantly, with
# no cold start to apologise for when somebody is holding a phone in front of a
# barangay captain.

services:
  # Singapore is the nearest region to the Philippines that Render offers.
  # Static sites are served from the CDN, so the region matters less here than
  # it would for a container.

  - type: web
    runtime: static
    name: ebarangay-demo
    branch: claude/clever-mayer-m25vsq
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_DEMO
        value: "1"
      # VITE_PRODUCT and VITE_DEMO_TIER are NOT set here, and that is the
      # point of the split. In the eLGU repository both had to be set on this
      # service — the manifest, the icon and the iOS home-screen label are
      # baked in at build time and cannot be corrected at runtime, so a build
      # that forgot them shipped the municipal app's name and mark under a
      # barangay's icon. Here `barangay` is the default in `vite.config.ts`
      # and `src/lib/demoServer.ts`, so the correct build is the one you get
      # by not configuring anything.
    headers:
      # The service worker must never be served from cache, or a visitor keeps
      # whichever build they first saw for as long as the cache lives.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      # The app is a single page and reads `?verify=` and `?doc=` off the query
      # string, so every path has to land on index.html.
      - type: rewrite
        source: /*
        destination: /index.html

# ---------------------------------------------------------------------------
# After the first apply
#
#   1. The demo carries sample data for Barangay Poblacion of a town called
#      Malasiqui, and every hotline in it is invented. It is for showing,
#      never for use.
#
#   2. Nothing here is a production barangay. When you have a customer and
#      their domain, follow DEPLOY.md — and set PUBLIC_URL to the domain
#      *before* the first document is issued, because every certificate's QR
#      is built from it and the PDF is stored rather than re-rendered.
